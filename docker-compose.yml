services:
  db:
    container_name: webhook-db
    image: postgres:17
    environment:
      - POSTGRES_DB=webhook
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=123456
      - PGDATA=/data/postgres
    volumes:
      - db:/data/postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  Kafka:
    container_name: webhook-kafka
    image: apache/kafka:4.1.0
    ports:
      - "9092:9092"
    restart: unless-stopped
volumes:
  db: