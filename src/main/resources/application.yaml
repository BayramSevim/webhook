spring:
  application:
    name: webhook
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/webhook}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:123456}
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always